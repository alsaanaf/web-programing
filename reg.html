<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Create an Account</h2>
        <p>Please fill out this form to register.</p>
        <hr>

        <form action="/submit-registration" method="POST">
            <!-- Full Name Field -->
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
            </div>

            <!-- Email Field -->
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <!-- Password Field -->
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="8" placeholder="Minimum 8 characters" required>
            </div>

            <!-- Confirm Password Field -->
            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Repeat your password" required>
            </div>

            <!-- Terms & Conditions Checkbox -->
            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the <a href="#">Terms & Privacy Policy</a></label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="register-btn">Register</button>
        </form>

        <div class="signin-link">
            <p>Already have an account? <a href="#">Sign in</a></p>
        </div>
    </div>

</body>
</html>
